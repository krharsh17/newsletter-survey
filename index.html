<html lang="en">
<head>

</head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>How do you run surveys? | Formspree</title>
<link rel="icon" type="image/x-icon" href="https://formspree.io/img/favicon.ico" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fff; padding: 24px;
    color: #111;
  }
  .card {
    width: 100%; max-width: 520px; background: #fff; border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.08); padding: 32px;
    border: 1px solid rgba(227,17,46,.12);
  }
  h1 { margin: 0 0 16px; font-size: 2.4rem; color: #111; text-align: center; }
  p.lead { margin: 0 0 32px; color: #33333380; font-size: .95rem; letter-spacing: 0.015em; line-height: 1.5; text-align: center; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: .9rem; color: #111; }
  .req { color: #E3112E; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px;
    font: inherit; background: #fff; color: #111;
  }
  textarea { min-height: 2.5em; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #8f8f8f; }
  input:focus, select:focus, textarea:focus {
    border-color: #E3112E;
    outline: none;
  }
  button {
    margin-top: 24px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px;
    background: #E3112E; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #c70f28; }
  button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
  .ok { margin-top: 18px; padding: 16px; background: #d1f7dd; color: #0f5c38; border-radius: 8px; line-height: 1.5; }
  .ok a { color: #0f5c38; font-weight: 600; }
  input[type="radio"], input[type="checkbox"] {
    width: auto; margin-right: 8px; accent-color: #E3112E;
  }
  .radio-option-group, .checkbox-option-group { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .radio-option-group label, .checkbox-option-group label {
    display: flex; align-items: center; font-weight: normal; margin: 0;
    padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 12px; cursor: pointer;
  }
  .radio-option-group label:hover, .checkbox-option-group label:hover { border-color: #E3112E; transition: border-color 0.2s ease; }

  .conditional {
    opacity: 0; visibility: hidden; max-height: 0; overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.4s ease, visibility 0.4s ease;
  }
  .conditional.show {
    opacity: 1; visibility: visible; max-height: 3000px;
  }
  .other-input { display: none; margin-top: 8px; }
  .other-input.show { display: block; }
  .exit-msg { margin-top: 20px; padding: 16px; background: #f5f5f5; color: #333; border-radius: 8px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div style="width: 100%; max-width: 520px;">
    <img src="formspree-header.png" alt="Formspree" style="width: 100%; max-width: 140px; margin: 0 auto 20px; display: block;" />
    <h1>How do you run surveys?</h1>
    <p class="lead">We're curious how Formspree users handle surveys today, and what would make running one from Formspree useful.</p>
    <div class="card">
    <form id="f" action="https://formspree.io/f/mrpgkgnv" method="POST">
      <input type="hidden" id="email" name="email" value="" />
      <input type="hidden" id="ajs_uid" name="ajs_uid" value="" />

      <div id="step1-section">
        <label>How many surveys have you run in the past 12 months? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="surveys_past_year" value="1" required /> 1</label>
          <label><input type="radio" name="surveys_past_year" value="2-4" /> 2–4</label>
          <label><input type="radio" name="surveys_past_year" value="5+" /> 5+</label>
          <label><input type="radio" name="surveys_past_year" value="None" /> None</label>
        </div>
        <button type="button" id="continue-btn" disabled>Continue</button>
      </div>

      <div id="exit-section" class="exit-msg" style="display: none;">
        That's all we needed. Thanks.
      </div>

      <div id="main-section" class="conditional">
        <label>What was the survey for? <span class="req">*</span></label>
        <textarea name="survey_purpose" placeholder="e.g. catering feedback, onboarding NPS, conference exit poll"></textarea>

        <label>How did you distribute it, and to whom? <span class="req">*</span></label>
        <div class="checkbox-option-group">
          <label><input type="checkbox" name="distribution" value="Emailed a link to our customers" /> Emailed a link to our customers</label>
          <label><input type="checkbox" name="distribution" value="Embedded inside our product or app" /> Embedded inside our product or app</label>
          <label><input type="checkbox" name="distribution" value="Emailed a link to prospects or a marketing list" /> Emailed a link to prospects or a marketing list</label>
          <label><input type="checkbox" name="distribution" value="Posted on our website and/or socials" /> Posted on our website and/or socials</label>
          <label><input type="checkbox" name="distribution" value="Shared the link privately with a specific group" /> Shared the link privately with a specific group</label>
          <label><input type="checkbox" name="distribution" value="Sent to internal team" /> Sent to internal team</label>
          <label><input type="checkbox" name="distribution" value="Other" id="dist-other-cb" /> Other</label>
        </div>
        <input type="text" id="dist-other-input" name="distribution_other" class="other-input" placeholder="Please specify" />

        <label>How many responses did it get? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="response_count" value="Under 10" /> Under 10</label>
          <label><input type="radio" name="response_count" value="10-49" /> 10–49</label>
          <label><input type="radio" name="response_count" value="50-199" /> 50–199</label>
          <label><input type="radio" name="response_count" value="200-999" /> 200–999</label>
          <label><input type="radio" name="response_count" value="1000+" /> 1,000+</label>
          <label><input type="radio" name="response_count" value="Still open / don't know" /> Still open / don't know</label>
        </div>

        <label>What did you use to build it? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="build_tool" value="Drag-and-drop builder" /> A drag-and-drop builder</label>
          <label><input type="radio" name="build_tool" value="Coded it myself" /> Coded it myself</label>
          <label><input type="radio" name="build_tool" value="AI" /> AI</label>
          <label><input type="radio" name="build_tool" value="Other" id="build-other-radio" /> Other</label>
        </div>
        <input type="text" id="build-other-input" name="build_tool_other" class="other-input" placeholder="Please specify" />

        <div id="q4a-section" class="conditional">
          <label>Which drag-and-drop builder? <span class="req">*</span></label>
          <input type="text" name="dnd_builder" placeholder="e.g. Google Forms, Tally, Typeform, Jotform" />
        </div>

        <div id="q4b-section" class="conditional">
          <label>What did you use — framework, form backend, anything else? <span class="req">*</span></label>
          <textarea name="coded_stack" placeholder="e.g. Next.js + Formspree, plain HTML on a Cloudflare page…"></textarea>
        </div>

        <div id="q4c-section" class="conditional">
          <label>Which AI tool? <span class="req">*</span></label>
          <div class="radio-option-group">
            <label><input type="radio" name="ai_tool" value="ChatGPT" /> ChatGPT</label>
            <label><input type="radio" name="ai_tool" value="Claude" /> Claude</label>
            <label><input type="radio" name="ai_tool" value="Gemini" /> Gemini</label>
            <label><input type="radio" name="ai_tool" value="Copilot" /> Copilot</label>
            <label><input type="radio" name="ai_tool" value="Cursor" /> Cursor</label>
            <label><input type="radio" name="ai_tool" value="v0" /> v0</label>
            <label><input type="radio" name="ai_tool" value="Lovable" /> Lovable</label>
            <label><input type="radio" name="ai_tool" value="Other" id="ai-other-radio" /> Other</label>
          </div>
          <input type="text" id="ai-other-input" name="ai_tool_other" class="other-input" placeholder="Please specify" />

          <label>What did you ask it? Paste the prompt if you have it. <span class="req">*</span></label>
          <textarea name="ai_prompt" placeholder="Paste your prompt or describe what you asked for"></textarea>
        </div>

        <label>What was the hardest part of running it, and how did you deal with it? <span class="req">*</span></label>
        <textarea name="hardest_part"></textarea>

        <label>What did you do with the responses afterward? <span class="req">*</span></label>
        <textarea name="responses_handling"></textarea>

        <label>Would you like to chat more about your survey use case? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="chat_consent" value="Yes" id="consent-yes" /> Yes</label>
          <label><input type="radio" name="chat_consent" value="No" id="consent-no" /> No</label>
        </div>

        <div id="consent-email-section" class="conditional">
          <label>Where can we reach you? <span class="req">*</span></label>
          <input type="email" name="contact_email" id="contact-email" placeholder="you@example.com" />
        </div>

        <button type="submit" disabled>Submit</button>
      </div>
    </form>
    <div id="ok" class="ok" style="display: none;"></div>
  </div>
  </div>

<script>
  // Pre-fill email from ?email= URL param
  const params = new URLSearchParams(location.search);
  const emailParam = params.get("email");
  const ajsUid = params.get("ajs_uid");
  if (emailParam) document.getElementById("email").value = emailParam;
  if (ajsUid) document.getElementById("ajs_uid").value = ajsUid;

  const screenerRadios = document.querySelectorAll('input[name="surveys_past_year"]');
  const step1Section = document.getElementById('step1-section');
  const mainSection = document.getElementById('main-section');
  const exitSection = document.getElementById('exit-section');
  const continueBtn = document.getElementById('continue-btn');
  const submitBtn = document.querySelector('button[type="submit"]');
  const form = document.getElementById('f');

  const buildRadios = document.querySelectorAll('input[name="build_tool"]');
  const q4a = document.getElementById('q4a-section');
  const q4b = document.getElementById('q4b-section');
  const q4c = document.getElementById('q4c-section');

  const distOtherCb = document.getElementById('dist-other-cb');
  const distOtherInput = document.getElementById('dist-other-input');
  const buildOtherRadio = document.getElementById('build-other-radio');
  const buildOtherInput = document.getElementById('build-other-input');
  const aiOtherRadio = document.getElementById('ai-other-radio');
  const aiOtherInput = document.getElementById('ai-other-input');

  function show(el, on) { el.classList.toggle('show', on); }
  function showOther(input, on) {
    input.classList.toggle('show', on);
    if (!on) input.value = '';
  }

  // Step 1 → enable Continue once a screener option is picked
  screenerRadios.forEach(r => {
    r.addEventListener('change', () => {
      continueBtn.disabled = false;
    });
  });

  continueBtn.addEventListener('click', () => {
    const screener = val('surveys_past_year');
    if (!screener) return;
    step1Section.style.display = 'none';
    if (screener === 'None') {
      exitSection.style.display = 'block';
    } else {
      show(mainSection, true);
      updateSubmit();
    }
  });

  // Q4 branch reveals
  buildRadios.forEach(r => {
    r.addEventListener('change', () => {
      show(q4a, r.value === 'Drag-and-drop builder');
      show(q4b, r.value === 'Coded it myself');
      show(q4c, r.value === 'AI');
      showOther(buildOtherInput, r.value === 'Other');
      updateSubmit();
    });
  });

  distOtherCb.addEventListener('change', () => {
    showOther(distOtherInput, distOtherCb.checked);
    updateSubmit();
  });

  document.querySelectorAll('input[name="ai_tool"]').forEach(r => {
    r.addEventListener('change', () => {
      showOther(aiOtherInput, r.value === 'Other');
      updateSubmit();
    });
  });

  const consentEmailSection = document.getElementById('consent-email-section');
  const contactEmailInput = document.getElementById('contact-email');
  document.querySelectorAll('input[name="chat_consent"]').forEach(r => {
    r.addEventListener('change', () => {
      const yes = r.value === 'Yes' && r.checked;
      show(consentEmailSection, yes);
      if (!yes) contactEmailInput.value = '';
      updateSubmit();
    });
  });

  // Re-validate on any change inside main section
  form.addEventListener('input', updateSubmit);
  form.addEventListener('change', updateSubmit);

  function val(name) {
    const el = document.querySelector(`[name="${name}"]:checked`);
    return el ? el.value : null;
  }
  function textVal(name) {
    const el = document.querySelector(`[name="${name}"]`);
    return el ? el.value.trim() : '';
  }

  function updateSubmit() {
    const screener = val('surveys_past_year');
    if (!screener || screener === 'None') { submitBtn.disabled = true; return; }

    const purpose = textVal('survey_purpose');
    const distChecked = document.querySelectorAll('input[name="distribution"]:checked').length > 0;
    const distOtherOk = !distOtherCb.checked || distOtherInput.value.trim().length > 0;
    const responses = val('response_count');
    const build = val('build_tool');
    const buildOtherOk = build !== 'Other' || buildOtherInput.value.trim().length > 0;
    const hardest = textVal('hardest_part');
    const responsesHandling = textVal('responses_handling');

    let branchOk = true;
    if (build === 'Drag-and-drop builder') branchOk = textVal('dnd_builder').length > 0;
    else if (build === 'Coded it myself') branchOk = textVal('coded_stack').length > 0;
    else if (build === 'AI') {
      const aiTool = val('ai_tool');
      const aiOtherOk = aiTool !== 'Other' || aiOtherInput.value.trim().length > 0;
      const prompt = textVal('ai_prompt');
      branchOk = !!aiTool && aiOtherOk && prompt.length > 0;
    }

    const consent = val('chat_consent');
    const emailOk = consent !== 'Yes' || /^\S+@\S+\.\S+$/.test(contactEmailInput.value.trim());
    const consentOk = !!consent && emailOk;

    submitBtn.disabled = !(purpose && distChecked && distOtherOk && responses && build && buildOtherOk && branchOk && hardest && responsesHandling && consentOk);
  }

  // AJAX submit
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" },
      });
      if (res.ok) {
        const ok = document.getElementById("ok");
        ok.textContent = "Thanks — your response has been submitted.";
        form.style.display = 'none';
        ok.style.display = "block";
      } else {
        alert("Submission failed. Please try again.");
        submitBtn.disabled = false;
      }
    } catch {
      alert("Network error. Please try again.");
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
