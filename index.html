<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Help us build smarter autoresponse | Formspree</title>
<link rel="icon" type="image/x-icon" href="https://formspree.io/img/favicon.ico" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fff; padding: 24px;
    color: #111;
  }
  .card {
    width: 100%; max-width: 520px; background: #fff; border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.08); padding: 32px;
    border: 1px solid rgba(227,17,46,.12);
  }
  h1 { margin: 0 0 16px; font-size: 2.4rem; color: #111; text-align: center; }
  p.lead { margin: 0 0 32px; color: #33333380; font-size: .95rem; letter-spacing: 0.015em; line-height: 1.5; text-align: center; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .9rem; color: #111; }
  .req { color: #E3112E; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px;
    font: inherit; background: #fff; color: #111;
  }
  textarea { min-height: 2.5em; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #8f8f8f; }
  input:focus, select:focus, textarea:focus {
    border-color: #E3112E;
    outline: none;
  }
  button {
    margin-top: 20px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px;
    background: #E3112E; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #c70f28; }
  button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
  .ok { display: none; margin-top: 18px; padding: 12px; background: #d1f7dd; color: #0f5c38; border-radius: 8px; }
  input[type="radio"], input[type="checkbox"] {
    width: auto; margin-right: 8px; accent-color: #ff6b6b;
  }
  .checkbox-group {
    display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0;
  }
  .radio-group {
    display: flex; gap: 16px; margin: 8px 0;
  }
  .radio-group label, .checkbox-group label {
    display: flex; align-items: center; font-weight: normal; margin: 0;
  }
  .checkbox-group label {
    display: flex; align-items: center; margin: 0; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 12px;
  }
  .checkbox-group label:hover {
    border-color: #E3112E;
    transition: border-color 0.2s ease;
  }

  .conditional {
    opacity: 0; visibility: hidden; max-height: 0; overflow: hidden; transition: opacity 0.4s ease, max-height 0.4s ease, visibility 0.4s ease;
  }
  .conditional.show {
    opacity: 1; visibility: visible; max-height: 1000px;
  }
  .other-input { display: none; margin-top: 8px; }
  .radio-option-group { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .radio-option-group label {
    display: flex; align-items: center; font-weight: normal; margin: 0;
    padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 12px; cursor: pointer;
  }
  .radio-option-group label:hover { border-color: #E3112E; transition: border-color 0.2s ease; }
  .radio-option-group input[type="radio"] { accent-color: #E3112E; }
</style>
</head>
<body>
  <div style="width: 100%; max-width: 520px;">
    <img src="formspree-header.png" alt="Formspree" style="width: 100%; max-width: 140px; margin: 0 auto 20px; display: block;" />
    <h1>Help us build smarter autoresponse</h1>
    <p class="lead">We're exploring AI autoresponse built directly into Formspree. Your feedback shapes what we build!</p>
    <div class="card">
    <form id="f" action="https://formspree.io/f/mdarozkd" method="POST">
      <input type="hidden" id="email" name="email" value="" />
      <input type="hidden" id="ajs_uid" name="ajs_uid" value="" />

      <label>Would you use AI autoresponse if it were built into Formspree? <span class="req">*</span></label>
      <div class="radio-group">
        <label><input type="radio" name="use_ai_autoresponse" value="yes" required /> Yes</label>
        <label><input type="radio" name="use_ai_autoresponse" value="no" /> No</label>
      </div>

      <div id="yes-section" class="conditional">
        <label>What's your biggest hesitation with the Zapier/Lindy approach? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="hesitation" value="Too many tools to manage" /> Too many tools to manage</label>
          <label><input type="radio" name="hesitation" value="Cost of extra tools" /> Cost of extra tools</label>
          <label><input type="radio" name="hesitation" value="Don't trust AI oversight" /> Don't trust AI oversight</label>
          <label><input type="radio" name="hesitation" value="Haven't tried it yet" /> Haven't tried it yet</label>
          <label><input type="radio" name="hesitation" value="No hesitation—will try it" /> No hesitation—will try it</label>
        </div>

        <label>What would you want Formspree's native version to do? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="native_behavior" value="Draft for me to review" /> Draft for me to review</label>
          <label><input type="radio" name="native_behavior" value="Auto-send simple, draft and wait for complex" /> Auto-send simple response, draft and wait for approval for complex ones</label>
          <label><input type="radio" name="native_behavior" value="Auto-send everything" /> Auto-send everything</label>
          <label><input type="radio" name="native_behavior" value="Simple acknowledgement response only" /> Simple acknowledgement response only</label>
        </div>
      </div>

      <div id="no-section" class="conditional">
        <label>What's the main reason you wouldn't use it? <span class="req">*</span></label>
        <div class="radio-option-group">
          <label><input type="radio" name="no_reason" value="Don't want AI in replies" /> Don't want AI in replies</label>
          <label><input type="radio" name="no_reason" value="Prefer a separate tool" /> Prefer a separate tool</label>
          <label><input type="radio" name="no_reason" value="Volume too low to need it" /> Volume too low to need it</label>
          <label><input type="radio" name="no_reason" value="Other" id="other-radio" /> Other (please specify)</label>
        </div>
        <input type="text" id="other-reason" name="other_reason" class="other-input" placeholder="Please specify" />
      </div>

      <button type="submit" disabled>Submit</button>
    </form>
    <div id="ok" class="ok" style="display: none;">Thanks! Your response has been submitted.</div>
  </div>
  </div>

<script>
  // Pre-fill email from ?email= URL param
  const params = new URLSearchParams(location.search);
  const email = params.get("email");
  const ajsUid = params.get("ajs_uid");
  if (email) document.getElementById("email").value = email;
  if (ajsUid) document.getElementById("ajs_uid").value = ajsUid;

  const q1Radios = document.querySelectorAll('input[name="use_ai_autoresponse"]');
  const yesSection = document.getElementById('yes-section');
  const noSection = document.getElementById('no-section');
  const submitBtn = document.querySelector('button[type="submit"]');

  function updateSubmitButton() {
    const q1 = document.querySelector('input[name="use_ai_autoresponse"]:checked');
    if (!q1) { submitBtn.disabled = true; return; }
    if (q1.value === 'yes') {
      const hesitation = document.querySelector('input[name="hesitation"]:checked');
      const native = document.querySelector('input[name="native_behavior"]:checked');
      submitBtn.disabled = !(hesitation && native);
    } else {
      const noReason = document.querySelector('input[name="no_reason"]:checked');
      submitBtn.disabled = !noReason;
    }
  }

  q1Radios.forEach(radio => {
    radio.addEventListener('change', () => {
      if (radio.value === 'yes') {
        yesSection.classList.add('show');
        noSection.classList.remove('show');
      } else {
        yesSection.classList.remove('show');
        noSection.classList.add('show');
      }
      updateSubmitButton();
    });
  });

  document.querySelectorAll('input[name="hesitation"], input[name="native_behavior"], input[name="no_reason"]').forEach(r => {
    r.addEventListener('change', updateSubmitButton);
  });

  // Toggle "Other" text input in No section
  const otherRadio = document.getElementById('other-radio');
  const otherInput = document.getElementById('other-reason');
  otherRadio.addEventListener('change', () => {
    otherInput.style.display = otherRadio.checked ? 'block' : 'none';
  });

  // AJAX submit so the user stays on the page
  const form = document.getElementById("f");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" },
      });
      if (res.ok) {
        form.style.display = 'none';
        document.getElementById("ok").style.display = "block";
      } else {
        alert("Submission failed. Please try again.");
        submitBtn.disabled = false;
      }
    } catch {
      alert("Network error. Please try again.");
    }
  });
</script>
</body>
</html>
