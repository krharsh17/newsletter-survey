<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Integration Request</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #faf4f4; padding: 24px;
    color: #111;
  }
  .card {
    width: 100%; max-width: 480px; background: #fff; border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.08); padding: 32px;
    border: 1px solid rgba(227,17,46,.12);
  }
  h1 { margin: 0 0 6px; font-size: 1.4rem; color: #111; }
  p.lead { margin: 0 0 22px; color: #333; font-size: .95rem; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .9rem; color: #111; }
  .req { color: #E3112E; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px;
    font: inherit; background: #fff; color: #111;
  }
  textarea { min-height: 110px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #8f8f8f; }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid rgba(227,17,46,.25); outline-offset: 1px; border-color: #E3112E;
  }
  button {
    margin-top: 20px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px;
    background: #E3112E; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
  }
  button:hover { background: #c70f28; }
  .ok { display: none; margin-top: 18px; padding: 12px; background: #fdecee; color: #9a121f; border-radius: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>How can we help?</h1>
    <p class="lead">Tell us how we can make lead enrichment simpler for you.</p>

    <form id="f" action="https://formspree.io/f/xaqvqzdz" method="POST">
      <label for="email">Email <span class="req">*</span></label>
      <input id="email" name="email" type="email" required autocomplete="email" />

      <label for="integration">New Integration <span class="req">*</span></label>
      <select id="integration" name="integration" required>
        <option value="" disabled selected>Select an option…</option>
        <option value="Clay Integration">Clay Integration</option>
        <option value="Apollo Integration">Apollo Integration</option>
        <option value="Native Lead Enrichment in Formspree">Native Lead Enrichment in Formspree</option>
      </select>

      <label for="notes">Notes <span style="color:#888;font-weight:400">(optional)</span></label>
      <textarea id="notes" name="notes" placeholder="Anything we should know?"></textarea>

      <button type="submit">Submit</button>
      <div id="ok" class="ok">Thanks! Your request has been submitted.</div>
    </form>
  </div>

<script>
  // Pre-fill email from ?email= URL param
  const params = new URLSearchParams(location.search);
  const email = params.get("email");
  if (email) document.getElementById("email").value = email;

  // AJAX submit so the user stays on the page
  const form = document.getElementById("f");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" },
      });
      if (res.ok) {
        form.reset();
        if (email) document.getElementById("email").value = email;
        document.getElementById("ok").style.display = "block";
      } else {
        alert("Submission failed. Please try again.");
      }
    } catch {
      alert("Network error. Please try again.");
    }
  });
</script>
</body>
</html>
