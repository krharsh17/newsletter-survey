</head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lead Enrichment Survey</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #fff; padding: 24px;
    color: #111;
  }
  .card {
    width: 100%; max-width: 520px; background: #fff; border-radius: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.08); padding: 32px;
    border: 1px solid rgba(227,17,46,.12);
  }
  h1 { margin: 0 0 16px; font-size: 2.4rem; color: #111; text-align: center; }
  p.lead { margin: 0 0 32px; color: #33333380; font-size: .95rem; letter-spacing: 0.015em; line-height: 1.5; text-align: center; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .9rem; color: #111; }
  .req { color: #E3112E; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px;
    font: inherit; background: #fff; color: #111;
  }
  textarea { min-height: 2.5em; resize: vertical; }
  input::placeholder, textarea::placeholder { color: #8f8f8f; }
  input:focus, select:focus, textarea:focus {
    border-color: #E3112E;
    outline: none;
  }
  button {
    margin-top: 20px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px;
    background: #E3112E; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #c70f28; }
  button:disabled { background: #ccc; color: #666; cursor: not-allowed; }
  .ok { display: none; margin-top: 18px; padding: 12px; background: #d1f7dd; color: #0f5c38; border-radius: 8px; }
  input[type="radio"], input[type="checkbox"] {
    width: auto; margin-right: 8px; accent-color: #ff6b6b;
  }
  .checkbox-group {
    display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0;
  }
  .radio-group {
    display: flex; gap: 16px; margin: 8px 0;
  }
  .radio-group label, .checkbox-group label {
    display: flex; align-items: center; font-weight: normal; margin: 0;
  }
  .checkbox-group label {
    display: flex; align-items: center; margin: 0; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 12px;
  }
  .checkbox-group label:hover {
    border-color: #E3112E;
    transition: border-color 0.2s ease;
  }

  .conditional {
    opacity: 0; visibility: hidden; max-height: 0; overflow: hidden; transition: opacity 0.4s ease, max-height 0.4s ease, visibility 0.4s ease;
  }
  .conditional.show {
    opacity: 1; visibility: visible; max-height: 1000px;
  }
  .other-input { display: none; margin-top: 8px; }
</style>
</head>
<body>
  <div style="width: 100%; max-width: 520px;">
    <img src="formspree-header.png" alt="Formspree" style="width: 100%; max-width: 140px; margin: 0 auto 20px; display: block;" />
    <h1>Lets do more with leads!</h1>
    <p class="lead">We're working on tools that help website builders, small businesses, and marketers create effective lead funnels. We'd love to hear from you!</p>
    <div class="card">
    <form id="f" action="https://formspree.io/f/xaqvqzdz" method="POST">
      <input type="hidden" id="email" name="email" value="" />
      <input type="hidden" id="ajs_uid" name="ajs_uid" value="" />

      <label>Do you currently enrich your leads? <span class="req">*</span></label>
      <div class="radio-group">
        <label><input type="radio" name="enrich_leads" value="yes" required /> Yes</label>
        <label><input type="radio" name="enrich_leads" value="no" /> No</label>
      </div>

      <div id="yes-section" class="conditional">
        <label>What tools/platforms do you use? <span class="req">*</span></label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="tools" value="HubSpot" /> HubSpot</label><br>
          <label><input type="checkbox" name="tools" value="Apollo" /> Apollo</label><br>
          <label><input type="checkbox" name="tools" value="Clay" /> Clay</label><br>
          <label><input type="checkbox" name="tools" value="ZoomInfo" /> ZoomInfo</label><br>
          <label><input type="checkbox" name="tools" value="Cognism" /> Cognism</label><br>
          <label><input type="checkbox" name="tools" value="Other" id="other-checkbox" /> Other</label>
          <input type="text" id="other-tool" name="other_tool" class="other-input" placeholder="Please specify" />
        </div>

        <label for="painful">What's the most annoying/painful part of lead enrichment? <span style="color:#888;font-weight:400">(optional)</span></label>
        <textarea id="painful" name="painful"></textarea>

        <label for="thoughts">Any other thoughts? <span style="color:#888;font-weight:400">(optional)</span></label>
        <textarea id="thoughts" name="thoughts"></textarea>
      </div>

      <div id="no-section" class="conditional">
        <label for="why_not">Why not? <span style="color:#888;font-weight:400">(optional)</span></label>
        <input id="why_not" name="why_not" type="text" placeholder="e.g., too complex, unaware of benefits, price, etc." />
      </div>

      <button type="submit">Submit</button>
      <div id="ok" class="ok" style="display: none;">Thanks! Your response has been submitted.</div>
    </form>
  </div>
  </div>

<script>
  // Pre-fill email from ?email= URL param
  const params = new URLSearchParams(location.search);
  const email = params.get("email");
  const ajsUid = params.get("ajs_uid");
  if (email) document.getElementById("email").value = email;
  if (ajsUid) document.getElementById("ajs_uid").value = ajsUid;

  // Toggle sections based on enrich_leads radio
  const enrichRadios = document.querySelectorAll('input[name="enrich_leads"]');
  const yesSection = document.getElementById('yes-section');
  const noSection = document.getElementById('no-section');
  const submitBtn = document.querySelector('button[type="submit"]');

  function updateSubmitButton() {
    const checked = document.querySelector('input[name="enrich_leads"]:checked');
    submitBtn.disabled = !checked;
  }

  enrichRadios.forEach(radio => {
    radio.addEventListener('change', () => {
      if (radio.value === 'yes') {
        yesSection.classList.add('show');
        noSection.classList.remove('show');
      } else if (radio.value === 'no') {
        yesSection.classList.remove('show');
        noSection.classList.add('show');
      }
      updateSubmitButton();
    });
  });

  // Initially disable submit
  updateSubmitButton();

  // Toggle other input
  const otherCheckbox = document.getElementById('other-checkbox');
  const otherInput = document.getElementById('other-tool');
  otherCheckbox.addEventListener('change', () => {
    otherInput.style.display = otherCheckbox.checked ? 'block' : 'none';
  });

  // AJAX submit so the user stays on the page
  const form = document.getElementById("f");
  form.addEventListener("submit", async (e) => {
    // Custom validation
    const enrichValue = document.querySelector('input[name="enrich_leads"]:checked');
    if (enrichValue && enrichValue.value === 'yes') {
      const toolsChecked = document.querySelectorAll('input[name="tools"]:checked');
      if (toolsChecked.length === 0) {
        alert("Please select at least one tool/platform.");
        e.preventDefault();
        return;
      }
    }

    e.preventDefault();
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, {
        method: "POST",
        body: data,
        headers: { Accept: "application/json" },
      });
      if (res.ok) {
        form.reset();
        if (email) document.getElementById("email").value = email;
        document.getElementById("ok").style.display = "block";
        // Hide sections after reset
        yesSection.classList.remove('show');
        noSection.classList.remove('show');
        otherInput.style.display = 'none';
      } else {
        alert("Submission failed. Please try again.");
      }
    } catch {
      alert("Network error. Please try again.");
    }
  });
</script>
</body>
</html>
